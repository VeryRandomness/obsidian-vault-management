name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to an exact commit, so a moved tag upstream can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: No serious known problems in the libraries that ship to users
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build
      - name: The committed main.js and lib.js must match a fresh build
        run: git diff --exit-code -- main.js lib.js
      - name: Install the test browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
