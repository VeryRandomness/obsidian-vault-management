name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to an exact commit, so a moved tag upstream can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: The committed main.js and lib.js must match a fresh build
        run: git diff --exit-code -- main.js lib.js
      - name: Install the test browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
